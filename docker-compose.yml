services:
  postgres:
    image: postgres:16-alpine
    container_name: songly-postgres
    environment:
      POSTGRES_DB: songly
      POSTGRES_USER: songly
      POSTGRES_PASSWORD: songly
    ports:
      - "5432:5432"
    volumes:
      - songly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songly -d songly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: songly-redis
    ports:
      - "6379:6379"
    volumes:
      - songly-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  songly-postgres-data:
  songly-redis-data:
