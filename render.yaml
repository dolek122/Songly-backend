databases:
  - name: songly-postgres
    plan: free
    databaseName: songly
    user: songly

services:
  - type: keyvalue
    name: songly-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: songly-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: songly-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: songly-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: songly-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: songly-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: songly-postgres
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: songly-redis
          property: connectionString
      # Render terminuje ruch na swoim proxy, więc bez tego rate limiter widziałby
      # jeden adres dla wszystkich klientów i odcinał ich wspólnym limitem.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      - key: JWT_SECRET
        sync: false
      - key: NOW_PLAYING_TOKEN_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      # Kanał e-mail (ADR 0008). Bez MAIL_PROVIDER=smtp instancja startuje z
      # domyślnym "log", czyli wypisuje token resetu hasła do logów zamiast go
      # wysłać — na produkcji to nie jest brak funkcji, tylko dziura: każdy z
      # dostępem do logów mógłby przejmować konta.
      - key: MAIL_PROVIDER
        value: smtp
      # SPRING_MAIL_HOST celowo nie ma tu wartości domyślnej — "smtp" bez hosta
      # wywala start aplikacji, i o to chodzi. Instancja, która tylko wygląda,
      # jakby wysyłała maile, byłaby awarią niezauważalną aż do pierwszego
      # zgłoszenia "nie dostałem linku".
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Link prowadzi do aplikacji klienckiej (formularz nowego hasła), nie do
      # backendu, który nie ma żadnego UI. Domyślnie songly://… (ADR 0037) —
      # pozostaw puste, chyba że celowo kierujesz linki gdzie indziej.
      - key: PASSWORD_RESET_URL
        sync: false
      - key: EMAIL_VERIFICATION_URL
        sync: false
      # Magazyn plików (ADR 0010) — Cloudflare R2 albo S3. Bez tego aplikacja
      # wystartuje, ale każdy upload skończy się 502 STORAGE_ERROR.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # Domena, spod której pliki czytają klienci — przy R2/CDN inna niż
      # STORAGE_ENDPOINT, pod który wgrywamy.
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
