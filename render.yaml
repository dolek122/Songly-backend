databases:
  - name: songly-postgres
    plan: free
    databaseName: songly
    user: songly

services:
  - type: keyvalue
    name: songly-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: songly-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: songly-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: songly-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: songly-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: songly-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: songly-postgres
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: songly-redis
          property: connectionString
      # Render terminuje ruch na swoim proxy, więc bez tego rate limiter widziałby
      # jeden adres dla wszystkich klientów i odcinał ich wspólnym limitem.
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      - key: JWT_SECRET
        sync: false
      - key: NOW_PLAYING_TOKEN_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
