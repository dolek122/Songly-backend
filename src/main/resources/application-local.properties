# Profil "local": przeklikiwanie aplikacji na komputerze dewelopera, z mobilką na
# emulatorze Androida. Włącza go wyłącznie jawne -Dspring-boot.run.profiles=local.
# Konta testowe zakłada LocalDevAccountsSeeder (tylko w tym profilu).

# Adres, pod którym KLIENT pobiera zdjęcia. Domyślny http://localhost:9000 z
# application.properties działa w przeglądarce na hoście, ale dla emulatora
# "localhost" to sam emulator — awatary i zdjęcia w postach by się nie
# wyświetlały. 10.0.2.2 to host widziany z emulatora (jak backend pod :8080).
# Symulator iOS widzi hosta jako localhost: STORAGE_PUBLIC_BASE_URL nadpisuje.
songly.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://10.0.2.2:9000/songly-media}
