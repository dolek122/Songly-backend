spring.application.name=Songly-backend
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:songly}
spring.datasource.username=${DB_USER:songly}
spring.datasource.password=${DB_PASSWORD:songly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Na Render ustaw zmienną środowiskową SPRING_DATA_REDIS_URL (nie REDIS_URL) —
# Spring Boot zmapuje ją automatycznie na spring.data.redis.url i nadpisze
# host/port/password powyżej. Celowo nie deklarujemy tu klucza z pustym
# defaultem: pusty string to dla Springa "ustawiony, ale nieparsowalny URL",
# a nie "nieustawiony" — więc lokalny dev (bez tej zmiennej) musi jej
# w ogóle nie widzieć w propertysource.

songly.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-every-real-environment-32bytes+}
songly.security.jwt.access-token-ttl=PT15M
songly.security.jwt.refresh-token-ttl=P30D

# Sprzątanie martwych sesji. Bez niego tabela sessions rośnie bez ograniczenia:
# każde logowanie wstawia wiersz, a każde odświeżenie tokenu wstawia kolejny i
# revoke'uje poprzedni. Retencja to okno na diagnozę "dlaczego mnie wylogowało",
# nie wymóg funkcjonalny — martwa sesja i tak nikogo nie wpuści.
songly.security.session-cleanup.enabled=true
songly.security.session-cleanup.interval=PT1H
songly.security.session-cleanup.retention=P7D
# Porcjami, żeby pierwszy przebieg na zaniedbanej tabeli nie robił jednego
# wielkiego DELETE-a trzymającego blokady przez cały czas trwania transakcji.
songly.security.session-cleanup.batch-size=5000
songly.security.session-cleanup.max-batches-per-run=20

# Magazyn plików (ADR 0010). Lokalnie MinIO z docker-compose, na produkcji
# Cloudflare R2 / S3 — ten sam protokół, więc jedna implementacja.
songly.storage.bucket=${STORAGE_BUCKET:songly-media}
songly.storage.region=${STORAGE_REGION:auto}
# Puste znaczy "prawdziwe AWS S3" — SDK złoży wtedy endpoint z regionu sam.
songly.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
songly.storage.access-key=${STORAGE_ACCESS_KEY:songly}
songly.storage.secret-key=${STORAGE_SECRET_KEY:songly-dev-secret}
# Osobny od endpointu: przy R2/CloudFroncie klienci czytają przez domenę CDN-u,
# a my wgrywamy przez API. Sklejanie jednego z drugiego działa wyłącznie w
# konfiguracji deweloperskiej.
songly.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/songly-media}
# MinIO nie ma wildcardowego DNS, więc bez path-style nie da się go użyć.
songly.storage.path-style-access=${STORAGE_PATH_STYLE:true}

# Limit egzekwuje kontener servletów, zanim bajty dotrą do kontrolera —
# sprawdzanie rozmiaru w kodzie wymagałoby najpierw przyjęcia całego pliku.
# max-request-size z zapasem na narzut multiparta wokół samego pliku.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Weryfikacja adresu przy rejestracji (ADR 0009). TTL dłuższy niż przy resecie:
# reset robi się w reakcji na problem, więc user siedzi przy skrzynce, a
# rejestrację często zaczyna się "na później".
songly.security.registration.ttl=PT24H
songly.security.registration.resend-interval=PT1M
songly.security.registration.verification-url=${EMAIL_VERIFICATION_URL:songly://verify-email?token={token}}
# Wygasłe zgłoszenia kasuje PendingRegistrationCleanupJob — inaczej adres i hash
# hasła osoby, która konta nie założyła, zostawałyby w bazie na zawsze.
songly.security.registration.cleanup-enabled=true
songly.security.registration.cleanup-interval=PT1H

# Reset hasła. TTL krótki, bo link leży w skrzynce pocztowej — systemie, nad
# którym nie mamy żadnej kontroli. resend-interval chroni cudzą skrzynkę przed
# zasypaniem: rate limiting jest per IP, więc sam by tego nie zrobił.
songly.security.password-reset.ttl=PT30M
songly.security.password-reset.resend-interval=PT1M
# Link prowadzi do aplikacji klienckiej (to ona pokazuje formularz nowego hasła
# i dopiero potem woła API), a nie do backendu, który nie ma żadnego UI.
songly.security.password-reset.reset-url=${PASSWORD_RESET_URL:songly://reset-password?token={token}}

# Kanał e-mail. Domyślnie "log": instancja, która przez pomyłkę wyśle prawdziwą
# wiadomość, jest gorsza od takiej, która przez pomyłkę tylko ją zaloguje.
# Na produkcji ustaw MAIL_PROVIDER=smtp razem ze spring.mail.* — samo "smtp"
# bez spring.mail.host celowo wywala start, zamiast po cichu przestać wysyłać.
songly.mail.provider=${MAIL_PROVIDER:log}
songly.mail.from=${MAIL_FROM:no-reply@songly.io}
# Kanał push (ADR 0040). Ten sam układ co poczta: domyślnie "log", a "fcm" bez
# klucza konta serwisowego Firebase celowo wywala start.
songly.push.provider=${PUSH_PROVIDER:log}
songly.push.fcm-credentials-json=${FCM_CREDENTIALS_JSON:}
# Ile urządzeń jednego konta dostaje pushe; nadmiar przycinamy od najdawniej
# zgłoszonych, inaczej każda reinstalacja zostawiałaby martwy token.
songly.notification.push.max-devices-per-user=10
# spring.mail.host celowo NIE jest tu zadeklarowany — ta sama pułapka co przy
# Redisie wyżej: autokonfiguracja poczty włącza się na samą OBECNOŚĆ tego
# klucza, więc pusty default znaczyłby "skonfigurowany serwer o pustym
# adresie". Powstałby wtedy bezużyteczny JavaMailSender, a MailConfig straciłby
# jedyny sposób odróżnienia "SMTP skonfigurowane" od "nieskonfigurowane".
# Na produkcji ustaw zmienną SPRING_MAIL_HOST (oraz SPRING_MAIL_USERNAME /
# SPRING_MAIL_PASSWORD). Reszta ustawień SMTP jest bezczynna bez hosta:
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Bez tych trzech JavaMail czeka na serwer pocztowy w nieskończoność (domyślny
# timeout to 0). Zawieszony SMTP zajmowałby wtedy na stałe wątek wysyłki, a
# kolejka z ADR 0041 zapełniałaby się po cichu. Milisekundy.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Zgłoszenia postów: ile jedna osoba może ich złożyć w oknie przesuwanym
# (ADR 0018). Bramki z ADR 0012 liczą per post, więc żadna nie ogranicza jednego
# konta w poprzek wielu postów — bez tego limitu jeden człowiek zapycha kolejkę
# moderacji i wysyła tyle samo maili każdemu moderatorowi.
songly.content.report.limit=20
songly.content.report.window=PT1H

# Przydział maleje z każdym ODRZUCONYM zgłoszeniem (ADR 0025): przy 20 i karze 5
# wychodzi 20 → 15 → 10 → 5 → podłoga. Podłoga nie jest zerem i to jest warunek,
# nie ostrożność — kilka odrzuceń nie może odebrać narzędzia, którym da się
# zgłosić nadużycie samego moderatora. Odrzucenia liczymy globalnie, bo
# zasypywanie rozłożone na wiele społeczności wymyka się licznikowi per
# społeczność.
songly.content.report.dismissal-penalty=5
songly.content.report.min-limit=1

# Jak długo rozstrzygnięte zgłoszenie liczy się do historii (ADR 0030). To NIE
# jest okno wyżej: tamto mierzy natężenie („ile zgłoszeń w godzinie"), to mierzy
# pamięć („jak długo pomyłka obniża przydział"). Kara wygasa sama, bez procesu w
# tle, i starzeją się obie strony bilansu — odrzucenia razem z trafieniami.
songly.content.report.history-window=P90D

# Odstęp między mailami rozsyłanymi do WSZYSTKICH moderatorów jednej
# społeczności (zgłoszenia, odwołania). Limit per osoba wyżej nie wystarcza:
# chroni przed jedną osobą, a nie przed dziesięcioma umówionymi, a zasypywana
# skrzynka jest jedna. Wyciszamy tylko pocztę — kolejka i powiadomienia zostają.
songly.notification.moderation-mail.moderator-interval=PT15M

songly.security.rate-limit.enabled=true
songly.security.rate-limit.limit=10
songly.security.rate-limit.window=PT1M
# Lista chronionych ścieżek siedzi w RateLimitProperties (wzorce PathPattern) —
# tu nadpisuj tylko, gdy któreś środowisko ma inne potrzeby.

# Limit zapisów per użytkownik na ścieżkach za JWT (ADR 0034). Reguły (budżet
# wszystkich zapisów + węższy na interakcje docierające do innych ludzi) siedzą
# w UserRateLimitProperties; nadpisanie songly.security.user-rate-limit.rules
# zastępuje całą listę.
songly.security.user-rate-limit.enabled=true

# Za proxy (Render) bez tego getRemoteAddr() zwraca adres proxy, więc rate limit
# liczyłby cały ruch świata do jednego kubełka i po kilkunastu żądaniach odciął
# wszystkich. "framework" każe Springowi przepisać X-Forwarded-For na
# getRemoteAddr. Lokalnie musi zostać "none": bez zaufanego proxy przed
# aplikacją ten nagłówek jest zwykłym polem od klienta, czyli darmowym
# obejściem limitu.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Ile "nieznanego gustu" dokładamy obu stronom, zanim uwierzymy w wynik
# dopasowania (ADR 0033). W jednostkach wag gatunków, czyli ln(1 + N/n) — 2.0 to
# z grubsza jeden typowy gatunek. Siedzi w mianowniku, więc przy ubogich
# profilach dominuje (jeden wspólny gatunek nie robi z nikogo bliźniaka), a przy
# bogatych znika. Zero przywraca zachowanie sprzed tego ADR-u.
songly.matching.confidence-prior=2.0

# Obraz popularności gatunków do ważenia dopasowań (ADR 0029, cache w ADR 0032).
# TTL jest długi, bo nie odpowiada za świeżość — tę zapewnia unieważnianie przy
# każdej zmianie ulubionych gatunków. Jest siatką bezpieczeństwa na zmiany, które
# obeszły aplikację: migrację, ręczny UPDATE, przywrócony backup.
songly.profile.genre-popularity.ttl=PT1H

songly.now-playing.token-encryption-key=${NOW_PLAYING_TOKEN_KEY:ZGV2LW9ubHktdG9rZW4tZW5jcnlwdGlvbi1rZXktMzI=}
songly.now-playing.cache-ttl=PT45S
songly.now-playing.oauth-state-ttl=PT10M
# Pamięć "ogłosiliśmy, że ten user gra" — dłuższa niż najdłuższy status (ręczny,
# 3h), bo służy do wykrycia, że status wygasł (ADR 0007).
songly.now-playing.announced-ttl=PT6H
# Dokąd callback OAuth odsyła przeglądarkę z wynikiem połączenia (ADR 0038).
songly.now-playing.connect-result-url=${SPOTIFY_CONNECT_RESULT_URL:songly://now-playing/spotify}
# Serwerowy poll obserwowanych użytkowników (ADR 0007, Etap 1b). Interwał
# krótszy od cache-ttl, żeby cache nie wygasał między przebiegami; mieści się
# w zalecanych 30–60s dla Spotify (Claude.md §7).
songly.now-playing.poll.enabled=true
songly.now-playing.poll.interval=PT30S
# Lock krótszy od interwału: ma wygasnąć przed kolejnym cyklem, żeby zdechła
# instancja nie zablokowała pollowania usera na stałe (ADR 0007, Etap 4).
songly.now-playing.poll.lock-ttl=PT25S
# Przerwa w odpytywaniu providera po jego 429, gdy sam nie poda Retry-After.
# Rate limit Spotify jest per client ID, więc pauza obowiązuje wszystkie
# instancje naraz — stąd znacznik w Redisie, nie w pamięci procesu.
songly.now-playing.poll.provider-backoff=PT1M
# Limity długo żyjących strumieni SSE (ADR 0007, Etap 4).
songly.now-playing.stream.timeout=PT30M
songly.now-playing.stream.max-per-user=3
songly.now-playing.stream.heartbeat.enabled=true
songly.now-playing.stream.heartbeat.interval=PT20S
songly.now-playing.spotify.client-id=${SPOTIFY_CLIENT_ID:dev-client-id}
songly.now-playing.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:dev-client-secret}
songly.now-playing.spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://localhost:8080/api/v1/now-playing/spotify/callback}
songly.now-playing.spotify.connect-timeout=PT5S
songly.now-playing.spotify.read-timeout=PT10S

# Pula harmonogramu musi pomieścić wszystkie zadania @Scheduled naraz. Przy
# jednym wątku (domyślnie) wolny poll Spotify wstrzymywałby heartbeat strumieni
# SSE, a te po kilkudziesięciu sekundach ciszy padają na proxy — awaria u
# jednego użytkownika kładłaby presence wszystkim (ADR 0007, Etapy 1b i 4).
# Zadania: poll now-playing, heartbeat SSE, sprzątanie sesji i wygasłych
# rejestracji. Dodajesz kolejne @Scheduled — podnieś tę liczbę.
spring.task.scheduling.pool.size=4

# Górna granica ?size= na każdej liście (§6). Domyślne 2000 Spring Data pozwalało
# jednym żądaniem pobrać po 2000 profili z wyszukiwarki czy członków
# społeczności. Większe size jest przycinane do tej wartości, nie odrzucane.
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized

logging.structured.format.console=ecs
